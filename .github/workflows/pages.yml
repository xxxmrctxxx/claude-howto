name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/build_website.py'
      - 'scripts/vendor_assets.py'
      - 'scripts/website_templates/**'
      - 'academy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache vendor assets
        uses: actions/cache@v4
        with:
          path: scripts/.vendor-cache
          key: vendor-${{ hashFiles('scripts/vendor_assets.py') }}
          restore-keys: |
            vendor-

      - name: Build website
        run: uv run scripts/build_website.py --verbose

      # Claude HowTo Academy (Next.js static export) is published next to the
      # docs site, under <pages base path>/academy/.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academy/package-lock.json

      - name: Build academy
        working-directory: academy
        env:
          ACADEMY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/academy
        run: |
          npm ci
          npm run build
          mkdir -p ../site/academy
          cp -r out/. ../site/academy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
